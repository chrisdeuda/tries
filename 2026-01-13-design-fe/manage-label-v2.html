<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Label - Chemical Safety Management</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="h-screen flex bg-gray-100">
    <!-- Sidebar -->
    <aside class="w-[280px] bg-[#3D3557] text-white">
        <nav class="flex flex-col">
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Substance Information</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Internal Information</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Transport Information</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Hazard & PPE Labelling</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Phrases/Statements</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Spillage Storage and Waste</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Work Exposure Limits (WELS)</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Usage</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">History</a>
            <a href="#" class="px-4 py-3 hover:bg-gray-700 transition-colors">Revisions</a>
            <a href="#" class="px-4 py-3 bg-blue-500 hover:bg-blue-600 transition-colors">Manage Label</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="p-4 flex gap-2 bg-white border-b">
            <button class="bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700 transition-colors">Autopopulate SDS Details</button>
            <button class="border border-gray-300 px-4 py-2 rounded text-sm hover:bg-gray-100 transition-colors">View SDS</button>
            <button class="border border-red-500 text-red-500 px-4 py-2 rounded text-sm hover:bg-red-50 transition-colors">View Risk Summary</button>
        </header>

        <!-- Form Container -->
        <div class="flex-1 p-6 overflow-auto">
            <form class="bg-white rounded-lg shadow p-6">
                <!-- Form Grid -->
                <div class="grid grid-cols-[140px_1fr] gap-x-6 gap-y-4 items-start">
                    <!-- Package Capacity -->
                    <label class="font-medium text-sm">Package Capacity</label>
                    <div class="flex flex-wrap gap-4">
                        <label class="flex items-center gap-2">
                            <input type="radio" name="capacity" value="small"> ≤3 Liters
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="capacity" value="medium"> >3L but ≤50L
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="capacity" value="large"> >50L but ≤500L
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="capacity" value="xlarge"> >500 Liters
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="capacity" value="default" checked> Default
                        </label>
                    </div>

                    <!-- CAS Numbers -->
                    <label for="cas" class="font-medium text-sm">CAS Numbers</label>
                    <input type="text" id="cas" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value="123-86-4, 64742-48-9, 34590-94-8, 15956-58-8, 95-50-1">

                    <!-- EINEC Numbers -->
                    <label for="einec" class="font-medium text-sm">EINEC Numbers</label>
                    <input type="text" id="einec" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value=",204-658-1,265-150-3,252-104-2,240-085-3,202-425-9">

                    <!-- Substance Name -->
                    <label for="substance" class="font-medium text-sm">Substance Name</label>
                    <input type="text" id="substance" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value="DIRECT TO RUST METAL PAINT SMOOTH AEROSOL">

                    <!-- Manufacturer -->
                    <label for="manufacturer" class="font-medium text-sm">Manufacturer</label>
                    <input type="text" id="manufacturer" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value="ICI Paints AkzoNobel">

                    <!-- Address -->
                    <label for="address" class="font-medium text-sm">Address</label>
                    <input type="text" id="address" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value="Wexham Road, Slough, Berkshire, SL2 5DS, U.K">

                    <!-- Tel -->
                    <label for="tel" class="font-medium text-sm">Tel</label>
                    <input type="text" id="tel" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value="+44 (0) 333 222 70 70">

                    <!-- Website -->
                    <label for="website" class="font-medium text-sm">Website</label>
                    <input type="text" id="website" class="border border-gray-300 rounded px-3 py-2 text-sm w-full" value="www.duluxtrade.co.uk">

                    <!-- Signal Word -->
                    <label class="font-medium text-sm">Signal Word</label>
                    <div class="flex flex-wrap gap-4">
                        <label class="flex items-center gap-2">
                            <input type="radio" name="signal" value="danger"> Danger
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="signal" value="warning"> Warning
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="signal" value="none"> None
                        </label>
                    </div>

                    <!-- Others -->
                    <label for="others" class="font-medium text-sm">Others</label>
                    <textarea id="others" class="border border-gray-300 rounded px-3 py-2 text-sm w-full h-36 resize-y"></textarea>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <footer class="p-4 flex justify-end gap-2 bg-white border-t">
            <button class="border border-gray-300 px-4 py-2 rounded text-sm hover:bg-gray-100 transition-colors">Preview</button>
            <button class="bg-blue-500 text-white px-4 py-2 rounded text-sm hover:bg-blue-600 transition-colors">Publish</button>
        </footer>
    </main>
</body>
</html>
