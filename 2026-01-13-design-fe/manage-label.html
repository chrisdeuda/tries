  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="p-4 flex gap-2 bg-white border-b">
      <button class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded text-sm">
        Autopopulate SDS Details
      </button>
      <button class="border border-gray-300 hover:bg-gray-50 px-4 py-2 rounded text-sm text-gray-700">
        View SDS
      </button>
      <button class="border border-red-500 hover:bg-red-50 text-red-500 px-4 py-2 rounded text-sm">
        View Risk Summary
      </button>
    </header>

    <!-- Form Content -->
    <div class="flex-1 p-6 overflow-auto">
      <form class="bg-white rounded-lg shadow p-6">
        <div class="grid grid-cols-[140px_1fr] gap-x-6 gap-y-4 items-start">

          <!-- Package Capacity -->
          <label class="text-sm text-gray-700 pt-2">Package Capacity:</label>
          <div class="flex flex-wrap gap-x-6 gap-y-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="capacity" value="3l" class="w-4 h-4">
              <span class="text-sm">≤ 3 Liters</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="capacity" value="3l-50l" class="w-4 h-4">
              <span class="text-sm">> 3L but ≤ 50L</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="capacity" value="50l-500l" class="w-4 h-4">
              <span class="text-sm">> 50L but ≤ 500L</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="capacity" value="500l" class="w-4 h-4">
              <span class="text-sm">> 500 Liters</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="capacity" value="default" class="w-4 h-4" checked>
              <span class="text-sm">Default</span>
            </label>
          </div>

          <!-- CAS Numbers -->
          <label class="text-sm text-gray-700 pt-2">CAS Numbers:</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="123-86-4, 64742-48-9, 34590-94-8, 15956-58-8, 95-50-1">

          <!-- EINEC Numbers -->
          <label class="text-sm text-gray-700 pt-2">EINEC Numbers:</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value=",204-658-1,265-150-3,252-104-2,240-085-3,202-425-9">

          <!-- Substance Name -->
          <label class="text-sm text-gray-700 pt-2">Substance Name :</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="DIRECT TO RUST METAL PAINT SMOOTH AEROSOL">

          <!-- Manufacturer -->
          <label class="text-sm text-gray-700 pt-2">Manufacturer:</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="ICI Paints AkzoNobel">

          <!-- Address -->
          <label class="text-sm text-gray-700 pt-2">Address:</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="Wexham Road, Slough, Berkshire, SL2 5DS, U.K">

          <!-- Tel -->
          <label class="text-sm text-gray-700 pt-2">Tel:</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="+44 (0) 333 222 70 70">

          <!-- Website -->
          <label class="text-sm text-gray-700 pt-2">Website:</label>
          <input type="text"
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="www.duluxtrade.co.uk">

          <!-- Signal Word -->
          <label class="text-sm text-gray-700 pt-2">Signal Word :</label>
          <div class="flex gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="signal" value="danger" class="w-4 h-4">
              <span class="text-sm">Danger</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="signal" value="warning" class="w-4 h-4">
              <span class="text-sm">Warning</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="signal" value="none" class="w-4 h-4" checked>
              <span class="text-sm">None</span>
            </label>
          </div>

          <!-- Others -->
          <label class="text-sm text-gray-700 pt-2">Others:</label>
          <textarea
            class="border border-gray-300 rounded px-3 py-2 text-sm w-full h-36 resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder=""></textarea>

        </div>
      </form>
    </div>

    <!-- Footer -->
    <footer class="p-4 flex justify-end gap-2 bg-white border-t">
      <button class="border border-gray-300 hover:bg-gray-50 px-4 py-2 rounded text-sm text-gray-700">
        Preview
      </button>
      <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm">
        Publish
      </button>
    </footer>
  </main>
